[project]
name = "protonmail-mcp"
version = "0.3.1"
description = "MCP server for ProtonMail Bridge — lets Claude read, search and send email via local Bridge"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Mattias Wahlberg", email = "mattias.wahlberg@proton.me" }]
keywords = ["mcp", "protonmail", "email", "claude", "llm"]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "aioimaplib>=2.0.1",
    "aiosmtplib>=5.1.2",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "idna>=3.15",
]

[project.urls]
Homepage = "https://github.com/mattias242/protonmail-mcp-server"
Repository = "https://github.com/mattias242/protonmail-mcp-server"
Issues = "https://github.com/mattias242/protonmail-mcp-server/issues"

[project.scripts]
protonmail-mcp = "protonmail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protonmail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integrationstesterna går mot riktiga Bridge och test_smtp.py skickar ett
# riktigt mejl. De körs bara på begäran: pytest -m integration
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: Integrationstester mot en riktig ProtonMail Bridge",
]
# Testerna talar medvetet protokollet före 2026-07-28 (resources/subscribe,
# ping), som dagens klienter använder; mcp 2.x varnar för det vid varje anrop
filterwarnings = [
    "ignore:.*is removed as of 2026-07-28:DeprecationWarning",
    "ignore:.*is removed as of 2026-07-28:UserWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-bdd>=7.0.0",
    "pytest-mock>=3.14.0",
]
